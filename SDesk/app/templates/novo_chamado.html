{% extends "base.html" %}

{% block title %}Novo Chamado - Sistema de Chamados{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Abrir Novo Chamado</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.novo_chamado') }}">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Titulo do Chamado</label>
                        <input type="text" name="titulo" class="form-control form-control-lg" 
                               placeholder="Ex: Computador nao liga, Erro no sistema..." required maxlength="200">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Descricao Detalhada</label>
                        <textarea name="descricao" class="form-control" rows="5" 
                                  placeholder="Descreva o problema com detalhes..." required></textarea>
                        <div class="form-text">Quanto mais detalhes, melhor sera o atendimento.</div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium">Departamento Responsavel</label>
                            <select name="departamento_id" class="form-select" required>
                                <option value="">Selecione...</option>
                                {% for dept in departamentos %}
                                <option value="{{ dept.id }}">{{ dept.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-medium">Prioridade</label>
                            <select name="prioridade" class="form-select" required>
                                <option value="Baixa">Baixa</option>
                                <option value="Media" selected>Media</option>
                                <option value="Alta">Alta</option>
                                <option value="Critica">Critica</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Voltar
                        </a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send me-2"></i>Abrir Chamado
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
